# Model-output: Claude Opus 5.5

name: build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust tools
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          RUSTC_FINGERPRINT="$(rustc +stable -Vv | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$RUSTC_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace dependencies
        run: cargo +stable generate-lockfile
      - name: Cache Cargo build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-support-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-support-
      - name: Check formatting and support crates
        run: make ci-support

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runtime: tokio
            target: ci-tokio
          - runtime: async-std
            target: ci-async-std
          - runtime: sync
            target: ci-sync
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust tools
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          RUSTC_FINGERPRINT="$(rustc +stable -Vv | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$RUSTC_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace dependencies
        run: cargo +stable generate-lockfile
      - name: Cache Cargo build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.runtime }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.runtime }}-
      # s3/tests/garage.rs starts its own garage servers. Garage publishes no checksums; this
      # one is the SHA-256 of the v2.4.1 binary as first downloaded.
      - name: Install garage for the end-to-end tests
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 -o "$HOME/.local/bin/garage" \
            https://garagehq.deuxfleurs.fr/_releases/v2.4.1/x86_64-unknown-linux-musl/garage
          echo "ae49f8de4aaee6b5ca305f7cbdccc8cd8a29b2804aac074649f18bfb83d0a2b6  $HOME/.local/bin/garage" \
            | sha256sum -c -
          chmod +x "$HOME/.local/bin/garage"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check S3 runtime and TLS configurations
        run: make ${{ matrix.target }}
